            "Notifications.TicketId=YES" \
            "Notifications.RecipientEmployeeId=YES" \
            "Notifications.RecipientAddress=YES" \
            "Notifications.DeliveryStatus=NO" \
            "Notifications.CorrelationId=NO" \
            "Notifications.OutboxMessageId=YES" \
            "Notifications.RetryCount=NO" \
            "OutboxMessages.OutboxMessageId=NO" \
            "OutboxMessages.CorrelationId=NO" \
            "OutboxMessages.Payload=NO" \
            "OutboxMessages.IdempotencyRecordId=NO" \
            "OutboxMessages.Status=NO" \
            "OutboxMessages.Attempts=NO" \
            "OutboxMessages.LastError=YES" \
            "OutboxMessages.ProcessedAtUtc=YES" | sort)
          echo "--- actual nullability ---"
          echo "$actual_sorted"
          echo "--- expected nullability ---"
          echo "$expected"
          if [ "$actual_sorted" != "$expected" ]; then
            echo "::error::Notifications/OutboxMessages column nullability does not match MVP-Data-Dictionary.md §2.21/§2.23."
            diff <(echo "$expected") <(echo "$actual_sorted") || true
