          export PATH="$PATH:/opt/mssql-tools18/bin"
          # MVP-Data-Dictionary.md §2.21/§2.23, asserted column by column.
          # RecipientAddress must be NULLABLE: a ticket whose verified
          # requester snapshot yields no deliverable email address still gets
          # a Notifications row, dead-lettered and visible, rather than being
          # silently skipped — a NOT NULL column here would force the code to
