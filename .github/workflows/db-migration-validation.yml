      - name: Verify schema — foreign keys on new Ticketing tables (senior review item 12)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Every FK from the new tables, and its delete behavior — must all
          # be NO_ACTION (Restrict): this schema never cascades a delete
          # into Tickets/IntakeRecords/history, consistent with the 7-year
          # retention posture carried through every prior architecture
          # document (MVP-ERD.md §3). DepartmentCustomerLookupSources ->
          # Departments and IntakeRecords -> Departments (DepartmentId, the
          # optional customer-lookup-source scoping FK) follow the same
          # posture.
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT OBJECT_NAME(parent_object_id) + '->' + OBJECT_NAME(referenced_object_id) + ':' + delete_referential_action_desc FROM sys.foreign_keys WHERE OBJECT_NAME(parent_object_id) IN ('Tickets','IntakeRecords','TicketRequesterSnapshots','TicketStatusHistory','Categories','TicketAssignments','TicketResolutions','TicketNotes','DepartmentCustomerLookupSources') ORDER BY 1;" | sed '/^$/d' | tr -d ' ')
          echo "--- foreign keys (child->parent:delete-action) ---"
          echo "$actual"
          fk_count=$(echo "$actual" | grep -c '.' || true)
          non_no_action=$(echo "$actual" | grep -v ':NO_ACTION$' || true)
          echo "Foreign key count: $fk_count"
          if [ -n "$non_no_action" ]; then
            echo "::error::Found FK(s) with a delete behavior other than NO_ACTION/Restrict:"
            echo "$non_no_action"
            exit 1
          fi
          # 28 = the original 27 plus Tickets->RequestTypes (the nullable
          # Workflow/Automation classification FK, Restrict like the rest);
          # 29 = 28 plus Tickets->WorkflowTemplates (AddWorkflowVersioning);
          # 30 = 29 plus IntakeRecords->Channels (AddChannels — Channel
          # Management's configurable channel catalogue). TicketInteractions
          # also gained a Channels FK, but TicketInteractions is not one of
          # the tables this check filters on, so it does not add to this count.
          if [ "$fk_count" -ne 30 ]; then
            echo "::error::Expected exactly 30 foreign keys across Categories/Tickets/TicketRequesterSnapshots/TicketStatusHistory/IntakeRecords/TicketAssignments/TicketResolutions/TicketNotes/DepartmentCustomerLookupSources (29 + IntakeRecords->Channels from AddChannels), found $fk_count."
            exit 1
          fi
          echo "All foreign keys on the new Ticketing tables are NO_ACTION (Restrict), as required."

      - name: Verify schema — filtered unique index (one current SLA period per ticket)
