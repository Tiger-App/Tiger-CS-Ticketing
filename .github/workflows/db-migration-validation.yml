      - name: Verify schema — filtered unique indexes on the Workflow/Automation tables
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # The four load-bearing invariants the Workflow/Automation phases
          # added, each a database guarantee the EF Core InMemory provider
          # used by the test suite cannot verify (it ignores filtered
          # indexes entirely — the same reason every other filtered-index
          # check in this job exists):
          #   - one originating interaction per ticket (TicketInteractions)
          #   - one open pending record per ticket (TicketPendingRecords)
          #   - one Pending approval cycle per (ticket, type) (TicketApprovals)
          #   - one current approval cycle per (ticket, type) (TicketApprovals)
          #   - one interaction per Genesys (conversation, service request) pair
          #     (TicketInteractions; created by AddGenesysIntegration as
          #     conversation-only, widened by
          #     AddGenesysServiceRequestToTicketInteractions) — the
          #     database-level guarantee behind "one Genesys service request
          #     produces exactly one ticket": without it two concurrent
          #     deliveries of the same request would both pass the
          #     application's read-side check and create two tickets. A
          #     conversation with no service request id (NULL) is still
          #     limited to one interaction (SQL Server treats NULLs as equal
          #     in a unique index); distinct service requests may share a
          #     conversation. The old conversation-only index
          #     UX_TicketInteractions_GenesysConversationId must be GONE.
          #   - one OPEN human-handoff per interaction (TicketAgentHandoffs,
          #     AddGenesysIntegration) — the same guarantee for pending human
          #     work: a redelivered "human required" event cannot produce a
          #     second work item for a conversation whose work is still
          #     outstanding. Filtered on unresolved rather than on the
          #     interaction, so a customer who needs a human again later is a
          #     new piece of work on the same ticket.
          #   - one row per Genesys work-item id when Genesys supplies one
          #     (TicketAgentHandoffs) — the stronger idempotency key, costing
          #     nothing while it is absent.
          declare -A expected_filters=(
            ["UX_TicketInteractions_OneOriginatingPerTicket"]="([IsOriginatingInteraction]=(1))"
            ["UX_TicketInteractions_GenesysConversationId_ServiceRequestId"]="([GenesysConversationId]ISNOTNULL)"
            ["UX_TicketAgentHandoffs_OpenPerInteraction"]="([ResolvedAtUtc]ISNULL)"
            ["UX_TicketAgentHandoffs_ExternalWorkItemId"]="([ExternalWorkItemId]ISNOTNULL)"
            ["UX_TicketPendingRecords_OpenPerTicket"]="([ResumedAtUtc]ISNULL)"
            ["UX_TicketApprovals_OnePendingPerType"]="([Status]=(1))"
            ["UX_TicketApprovals_OneCurrentPerType"]="([IsCurrent]=(1))"
            ["UX_WorkflowTemplates_OnePublishedPerWorkflow"]="([Status]=(2))"
            ["UX_WorkflowTemplates_OneDraftPerWorkflow"]="([Status]=(1))"
          )
          for index_name in "${!expected_filters[@]}"; do
            filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
              -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = '$index_name' AND is_unique = 1;")
            filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
            echo "$index_name filter_definition = '$filter_trimmed'"
            if [ "$filter_trimmed" != "${expected_filters[$index_name]}" ]; then
              echo "::error::$index_name filter_definition was '$filter_trimmed', expected '${expected_filters[$index_name]}' (missing, not unique, or the filter changed)."
              exit 1
            fi
          done

          # The old conversation-only unique index is intentionally replaced; it must not come back.
          old=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.indexes WHERE name = 'UX_TicketInteractions_GenesysConversationId';" | tr -d '[:space:]')
          if [ "$old" != "0" ]; then
            echo "::error::UX_TicketInteractions_GenesysConversationId still exists; it must be replaced by UX_TicketInteractions_GenesysConversationId_ServiceRequestId."
            exit 1
          fi

          # The composite key columns, in order, and the plain (non-unique) conversation lookup index.
          key_cols=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT STRING_AGG(c.name, ',') WITHIN GROUP (ORDER BY ic.key_ordinal) FROM sys.indexes i JOIN sys.index_columns ic ON ic.object_id = i.object_id AND ic.index_id = i.index_id JOIN sys.columns c ON c.object_id = ic.object_id AND c.column_id = ic.column_id WHERE i.name = 'UX_TicketInteractions_GenesysConversationId_ServiceRequestId';" | tr -d '[:space:]')
          echo "UX_TicketInteractions_GenesysConversationId_ServiceRequestId key columns = '$key_cols'"
          if [ "$key_cols" != "GenesysConversationId,GenesysServiceRequestId" ]; then
            echo "::error::Composite unique index key columns were '$key_cols', expected 'GenesysConversationId,GenesysServiceRequestId'."
            exit 1
          fi
          lookup=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT CAST(is_unique AS int) FROM sys.indexes WHERE name = 'IX_TicketInteractions_GenesysConversationId' AND filter_definition IS NOT NULL;" | tr -d '[:space:]')
          if [ "$lookup" != "0" ]; then
            echo "::error::IX_TicketInteractions_GenesysConversationId must exist, be NON-unique and filtered (got '$lookup')."
            exit 1
          fi

          # Behaviour on this SQL Server (the EF InMemory/SQLite providers cannot show it): the same index shape on a scratch table.
          # Expected: one (conversation, NULL) legacy row per conversation; several distinct service requests per conversation;
          # the same pair twice rejected; rows with no conversation unrestricted.
          # sqlcmd connects with QUOTED_IDENTIFIER OFF by default, which SQL Server refuses for DML on a table with a filtered index
          # (Msg 1934). -I turns it ON for the connection, and the SET options a filtered index requires are also stated explicitly in the
          # batch so the probe does not depend on client defaults. The whole probe is ONE sqlcmd invocation (one connection / session).
          probe=$(sqlcmd -I -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W -b -Q "
            SET ANSI_NULLS ON; SET ANSI_PADDING ON; SET ANSI_WARNINGS ON; SET ARITHABORT ON;
            SET CONCAT_NULL_YIELDS_NULL ON; SET QUOTED_IDENTIFIER ON; SET NUMERIC_ROUNDABORT OFF;
            SET NOCOUNT ON;
            CREATE TABLE #p (Id int IDENTITY PRIMARY KEY, C nvarchar(64) NULL, S nvarchar(64) NULL);
            CREATE UNIQUE INDEX UX_p ON #p (C, S) WHERE C IS NOT NULL;
            INSERT #p (C, S) VALUES ('c1', NULL), ('c1', 'documents'), ('c1', 'leasing'), ('c2', 'documents'), (NULL, NULL), (NULL, NULL);
            DECLARE @legacyDup nvarchar(8) = 'accepted', @pairDup nvarchar(8) = 'accepted';
            BEGIN TRY INSERT #p (C, S) VALUES ('c1', NULL); END TRY BEGIN CATCH SET @legacyDup = 'rejected'; END CATCH;
            BEGIN TRY INSERT #p (C, S) VALUES ('c1', 'leasing'); END TRY BEGIN CATCH SET @pairDup = 'rejected'; END CATCH;
            SELECT @legacyDup + '/' + @pairDup + '/' + CAST((SELECT COUNT(*) FROM #p WHERE C = 'c1') AS varchar(5));" | tr -d '[:space:]')
          echo "service-request index probe (legacy NULL duplicate / same pair duplicate / rows kept for c1) = '$probe'"
          if [ "$probe" != "rejected/rejected/3" ]; then
            echo "::error::Composite index semantics wrong: expected 'rejected/rejected/3'."
            exit 1
          fi

          echo "All nine filtered unique indexes are present with the expected filters (the two WorkflowTemplates ones guarantee at most one Published and one Draft version per workflow; the two TicketAgentHandoffs ones are what stop a redelivered Genesys handoff event from creating a second pending work item)."

      - name: Verify no schema drift (no-op probe migration)
        working-directory: src
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations has-pending-model-changes \
            --project TigerCS.Infrastructure --startup-project TigerCS.Infrastructure
