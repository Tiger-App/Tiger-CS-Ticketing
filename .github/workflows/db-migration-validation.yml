          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT OBJECT_NAME(parent_object_id) + '->' + OBJECT_NAME(referenced_object_id) + ':' + delete_referential_action_desc FROM sys.foreign_keys WHERE OBJECT_NAME(parent_object_id) IN ('Notifications','OutboxMessages') ORDER BY 1;" | sed '/^$/d' | tr -d ' ')
          echo "--- foreign keys (child->parent:delete-action) ---"
