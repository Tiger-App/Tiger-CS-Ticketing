          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT TABLE_NAME + '.' + COLUMN_NAME + '=' + IS_NULLABLE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME IN ('Notifications','OutboxMessages') AND COLUMN_NAME IN ('TicketId','RecipientEmployeeId','RecipientAddress','DeliveryStatus','CorrelationId','OutboxMessageId','RetryCount','IdempotencyRecordId','Status','Attempts','LastError','ProcessedAtUtc','Payload') ORDER BY 1;" | sed '/^$/d' | tr -d ' ')
          actual_sorted=$(echo "$actual" | sort)
