      - name: Verify schema — filtered unique index (one notification per Outbox message and type)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # The database-level half of "duplicate processing does not send
          # twice": a genuine race between two dispatch attempts for one
          # message cannot produce two delivery rows. Filtered because
          # OutboxMessageId is nullable (MVP-Data-Dictionary.md §2.21 allows a
          # Pending row before its Outbox link) and SQL Server treats multiple
          # NULLs as duplicates in a unique index — without the filter, the
          # second such row would be rejected for entirely the wrong reason.
          #
          # Asserted here rather than in a unit test because the EF Core
          # InMemory provider ignores filtered unique indexes entirely.
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'UX_Notifications_OutboxMessageId_NotificationType' AND is_unique = 1;" | sed '/^$/d' | tr -d ' ')
          echo "filter_definition: '$filter'"
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          if [ -z "$filter_trimmed" ]; then
            echo "::error::UX_Notifications_OutboxMessageId_NotificationType is missing or not unique."
            exit 1
          fi
          if [ "$filter_trimmed" != "([OutboxMessageId]ISNOTNULL)" ]; then
            echo "::error::UX_Notifications_OutboxMessageId_NotificationType filter_definition was '$filter_trimmed', expected '([OutboxMessageId]ISNOTNULL)'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — filtered dispatcher and dead-letter indexes on OutboxMessages
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # The dispatcher's hot path reads only Pending rows, and ADR-0020
          # alerts on the dead-letter count. Both indexes are filtered so
          # Processed rows — which accumulate indefinitely, since nothing
          # deletes them — never grow either index. Filters are asserted
          # exactly: an index that silently lost its filter would still answer
          # every query correctly while quietly degrading as the table grows.
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT name + '=' + ISNULL(REPLACE(REPLACE(filter_definition, ' ', ''), CHAR(9), ''), 'NOFILTER') FROM sys.indexes WHERE object_id = OBJECT_ID('OutboxMessages') AND name IS NOT NULL AND name LIKE 'IX_%' ORDER BY name;" | sed '/^$/d' | tr -d ' ')
          actual_sorted=$(echo "$actual" | sort)
          expected=$(printf '%s\n' \
            "IX_OutboxMessages_CorrelationId=NOFILTER" \
            "IX_OutboxMessages_DeadLettered=([Status]=(3))" \
            "IX_OutboxMessages_IdempotencyRecordId=NOFILTER" \
            "IX_OutboxMessages_Status_OccurredAtUtc=([Status]=(1))" | sort)
          echo "--- actual ---"
          echo "$actual_sorted"
          echo "--- expected ---"
          echo "$expected"
          if [ "$actual_sorted" != "$expected" ]; then
            echo "::error::Indexes on OutboxMessages do not match the expected set exactly."
            diff <(echo "$expected") <(echo "$actual_sorted") || true
            exit 1
          fi
          echo "OutboxMessages indexes match, with the expected filters."

      - name: Verify schema — Notifications/OutboxMessages column nullability
