name: DB Migration Validation

# Applies InitialIdentityAndAccess to a real SQL Server (a service container,
# not InMemory/mocked) and verifies the resulting schema — the one check
# this sandbox's own dev environment could not run itself (no Docker
# daemon available there). See docs/DEV-SETUP.md §7 for the equivalent
# manual checklist.
#
# Path-filtered to schema-relevant changes (Infrastructure/Domain code, this
# workflow file itself) so it doesn't re-run on unrelated documentation-only
# changes.

on:
  pull_request:
    branches: ["main"]
    paths:
      - "src/TigerCS.Infrastructure/**"
      - "src/TigerCS.Domain/**"
      - ".github/workflows/db-migration-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "src/TigerCS.Infrastructure/**"
      - "src/TigerCS.Domain/**"
      - ".github/workflows/db-migration-validation.yml"
  workflow_dispatch: {}

jobs:
  validate-migration:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Validation-Only-Passw0rd!"
        ports:
          - 1433:1433
        # No Docker HEALTHCHECK here (two attempts at one — an in-container
        # sqlcmd path guess, then a bash /dev/tcp probe — both left the
        # service stuck "unhealthy" until GitHub Actions gave up and tore
        # the container down before the job's own steps ever ran, even
        # though the container logs showed SQL Server had finished starting
        # each time). Readiness is instead handled by the retry loop in the
        # "Apply migration" step below — the same pattern commonly used for
        # this image in GitHub Actions services, since its healthcheck
        # tooling isn't as predictable across image builds as postgres/mysql's.

    env:
      TIGERCS_DESIGN_TIME_CONNECTION: "Server=localhost,1433;Database=TigerCsTicketing_CI;User Id=sa;Password=Ci-Validation-Only-Passw0rd!;TrustServerCertificate=True;"
      SA_PASSWORD: "Ci-Validation-Only-Passw0rd!"

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Restore
        working-directory: src
        run: dotnet restore TigerCS.slnx

      - name: Generate and inspect the idempotent migration SQL script
        working-directory: src
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # Senior review item 12 — generated and inspected directly, not
          # just applied via `database update`, so the exact DDL this
          # migration would run against any target database (idempotent:
          # safe to run against a database already at some prior migration)
          # is visible in this job's own log, not just its net effect.
          dotnet ef migrations script --idempotent \
            --project TigerCS.Infrastructure --startup-project TigerCS.Infrastructure \
            -o idempotent-migration.sql
          echo "::group::Idempotent migration script (InitialIdentityAndAccess..AddTicketOperations)"
          cat idempotent-migration.sql
          echo "::endgroup::"

      - name: Upload idempotent migration SQL script
        uses: actions/upload-artifact@v4
        with:
          name: idempotent-migration-sql
          path: src/idempotent-migration.sql
          retention-days: 30

      - name: Apply migrations (all pending — through AddWorkflowConfiguration, AddWorkflowAutomation, ReplaceInteractionContextWithTicketInteractions, AddApprovalWorkflow, AddWorkflowVersioning)
        working-directory: src
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          # The retry loop is a safety net for the service container's own
          # startup time (SQL Server can take a few seconds after the
          # container is created); it is not a substitute for the Restore
          # step above — dotnet ef's own msbuild invocation needs
          # obj/project.assets.json to already exist and does not
          # implicitly restore it.
          for attempt in $(seq 1 10); do
            if dotnet ef database update \
              --project TigerCS.Infrastructure --startup-project TigerCS.Infrastructure \
              --verbose; then
              exit 0
            fi
            echo "Migration attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "::error::dotnet ef database update did not succeed after 10 attempts (100s)."
          exit 1

      - name: Install sqlcmd
        run: |
          ubuntu_release=$(lsb_release -rs)
          echo "Runner Ubuntu release: $ubuntu_release"
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
          curl -sSL "https://packages.microsoft.com/config/ubuntu/${ubuntu_release}/prod.list" | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
          sudo apt-get update -y
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Apply the generated idempotent SQL script as one batch (the deployment path)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # `dotnet ef database update` above sends each migration command
          # to SQL Server separately, so it can never reproduce the failure
          # class that broke AddWorkflowVersioning in UAT: EF Core 9+ emits
          # the script as ONE batch per migration (BEGIN TRANSACTION ...
          # COMMIT; GO), and SQL Server binds every DML statement of a batch
          # before executing any of it — a raw UPDATE naming a column that an
          # earlier statement of the same migration adds or renames fails at
          # compile time with "Invalid column name". Running the script that
          # the first step generated through sqlcmd (which splits on GO
          # exactly as SSMS does) against a SEPARATE, fresh database is the
          # deployment path itself, so a migration that only works
          # command-by-command is caught here rather than on a UAT server.
          # -b makes sqlcmd exit non-zero on the first SQL error.
          # -I sets QUOTED_IDENTIFIER ON for the session: sqlcmd defaults it
          # OFF, and SQL Server then refuses to CREATE the schema's filtered
          # indexes (Msg 1934) or to INSERT/UPDATE tables that carry one.
          # SSMS and SqlClient default it ON, so a deployment run from sqlcmd
          # must pass -I explicitly — the same applies to the UAT script.
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -b -I \
            -Q "CREATE DATABASE [TigerCsTicketing_CI_Script];"
          sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -b -I \
            -d TigerCsTicketing_CI_Script -i src/idempotent-migration.sql
          applied=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -b -I -d TigerCsTicketing_CI_Script -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [__EFMigrationsHistory] WHERE [MigrationId] = N'20260908054944_AddWorkflowVersioning';")
          if [ "$applied" != "1" ]; then
            echo "::error::The idempotent script ran but did not record AddWorkflowVersioning in __EFMigrationsHistory (got '$applied')."
            exit 1
          fi
          echo "Idempotent script applied as single batches; AddWorkflowVersioning recorded."

      - name: Verify schema — exact table list
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT name FROM sys.tables ORDER BY name;" | sed '/^$/d')
          expected=$(printf '%s\n' \
            "AspNetRoleClaims" "AspNetRoles" "AspNetUserClaims" "AspNetUserLogins" \
            "AspNetUserRoles" "AspNetUserTokens" "AspNetUsers" "Departments" \
            "Employees" "UserDepartmentAssignments" \
            "AuditEntries" "ContactReferences" "UnitReferences" "VerificationSessions" \
            "Categories" "Channels" "Priorities" "IntakeRecords" "Tickets" \
            "TicketRequesterSnapshots" "TicketStatusHistory" \
            "TicketAssignments" "TicketResolutions" "TicketNotes" \
            "SlaPolicies" "BusinessCalendars" "BusinessCalendarWorkingDays" "Holidays" \
            "TicketSlaInstances" "TicketEscalations" "IdempotencyRecords" \
            "OutboxMessages" "Notifications" \
            "TicketReviewInvitations" "TicketReviews" \
            "DepartmentCustomerLookupSources" \
            "WorkflowTemplates" "WorkflowTemplateSteps" "RequestTypes" \
            "RequestTypeSlaPolicies" "DepartmentWorkflowSettings" \
            "RequestTypeAssignmentRules" "RequestTypeAssignmentRuleMembers" \
            "RequestTypeApprovalRequirements" \
            "TicketPendingRecords" "TicketInteractions" "TicketInteractionMessages" \
            "TicketAgentHandoffs" "TicketInteractionHandlers" \
            "GenesysQueueMappings" "GenesysScreenPopLaunches" \
            "TicketApprovals" "TicketWorkflowEvents" \
            "Workflows" "WorkflowStepTransitions" \
            "CollectionsReminders" "CollectionsReminderChannels" "CollectionsReminderEvents" \
            "CrmDocumentDeliveryRequests" "CustomerOtpChallenges" \
            "TicketSlaPausePeriods" "PriorityDowngradeRequests" \
            "CollectionsReviewRuns" "CollectionsReviewRecords" "CollectionsDispatches" \
            "CollectionsDispatchItems" "CollectionsGenesysBatches" \
            "CollectionsGenesysMessageResults" "CollectionsGenesysSyncStates" "CollectionsExceptionInclusions" \
            "DepartmentAssignmentRotations" "UserPermissionOverrides" "UserTransferDepartments" \
            "CollectionsTowerAssignments" "CollectionsTowerAssignmentHistory" "TicketAssignmentHistory" "TicketCollectionsUnits" "CustomerContactDetails" \
            "__EFMigrationsHistory" | sort)
          actual_sorted=$(echo "$actual" | sort)
          echo "--- actual tables ---"
          echo "$actual_sorted"
          echo "--- expected tables ---"
          echo "$expected"
          if [ "$actual_sorted" != "$expected" ]; then
            echo "::error::Table list does not match the expected Identity and Access + CRM Verification + Ticketing + SLA and Escalation + Notifications + Workflow/Automation schema exactly."
            diff <(echo "$expected") <(echo "$actual_sorted") || true
            exit 1
          fi
          echo "Table list matches exactly: 79 tables (UserTransferDepartments added by AddUserTransferDepartments — the departments an employee may transfer tickets to, separate from membership; CollectionsExceptionInclusions added by AddCollectionsExceptionInclusions — manual GULF_CUSTOMERS inclusions with who, when and which Manual campaign; CollectionsGenesysMessageResults and CollectionsGenesysSyncStates added by AddCollectionsGenesysDeliveryStats — delivery results saved by the manual Sync from Genesys, and the last sync outcome per campaign; CustomerContactDetails added by AddCustomerContactDetails — the name/e-mail an agent typed in, one row per canonical phone number; CollectionsTowerAssignments, CollectionsTowerAssignmentHistory, TicketAssignmentHistory and TicketCollectionsUnits added by AddCollectionsTowerAssignments — the monthly tower-to-collector mapping with its append-only history, the Collections ticket assignment log, and the verified tower/unit selected for a Collections transfer; DepartmentAssignmentRotations added by AddDepartmentAssignmentRotation — the persisted Round Robin cursor, one row per department; UserPermissionOverrides added by AddUserPermissionOverrides — employee-specific permission grants and denials; TicketInteractionHandlers added by AddTicketInteractionHandlers — one row per Ticketing user per Genesys interaction that user actually handled, the source of truth for CS Agent ticket visibility; CollectionsReviewRuns, CollectionsReviewRecords, CollectionsDispatches, CollectionsDispatchItems and CollectionsGenesysBatches added by AddCollectionsReviewAndGenesysDispatch — the stored Collections review data, approved Genesys dispatches with their items and per-batch upload results; CustomerOtpChallenges added by AddCustomerOtpVerification — hashed, salted email-OTP challenges; TicketSlaPausePeriods and PriorityDowngradeRequests added by AddSlaPauseAndPriorityDowngrade — SLA pause/resume periods and Department-Head-approved priority downgrades; CrmDocumentDeliveryRequests added by AddChatbotInactivityAndCrmDocumentCopies — the per-caller idempotent record of a chatbot document-copy delivery; CollectionsReminders, CollectionsReminderChannels and CollectionsReminderEvents added by AddCollectionsReminders — payment reminder jobs with the amount quoted, their per-channel delivery state (unique per account/type/cycle/channel) and their delivery events and customer responses; never a balance, which is always read from the financial source; Workflows and WorkflowStepTransitions added by AddWorkflowVersioning; WorkflowTemplates is now the version table; Channels added by AddChannels — Channel Management's configurable channel catalogue, replacing the former fixed enum; TicketInteractionMessages, GenesysQueueMappings and TicketAgentHandoffs added by AddGenesysIntegration; GenesysScreenPopLaunches added by AddGenesysScreenPopLaunches — secure one-time Genesys Screen Pop launch tokens, valid for one hour and stored only as a SHA-256 hash, never the token itself). TicketAgentHandoffs is pending HUMAN work raised from an interaction on any channel — deliberately not a callback table: a callback is one follow-up mode among several, and most rows will be chat, WhatsApp or social. It is a separate table rather than columns on TicketInteractions because the work outlives the interaction: a customer who closes the browser while waiting ends the interaction, and the work must stay actionable. The Genesys tables present are ONLY the transcript, the routing configuration and the Screen Pop launch tokens: the Genesys interaction context itself still lives as nullable columns on TicketInteractions, not a table of its own, and no GenesysInteractions/GenesysInteractionEvents/GenesysAgentMappings tables exist — those belong to a design that assumed a webhook contract the Genesys team has not confirmed. GenesysDepartmentSettings is deliberately absent as well: a per-department default Category existed only to satisfy the old Tickets.CategoryId NOT NULL constraint, and a Genesys ticket is now created Unclassified instead. TicketInteractionContexts is deliberately absent too — created by AddWorkflowAutomation and replaced by the 1-to-many TicketInteractions in ReplaceInteractionContextWithTicketInteractions."

      - name: Verify schema — filtered unique index (one primary department per employee)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'IX_UserDepartmentAssignments_EmployeeId_PrimaryOnly';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([IsPrimary]=(1))" ]; then
            echo "::error::IX_UserDepartmentAssignments_EmployeeId_PrimaryOnly filter_definition was '$filter_trimmed', expected '([IsPrimary]=(1))'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — filtered unique index (CRM verification-session idempotency)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # This is the real, SQL-Server-only enforcement mechanism behind
          # VerificationSessionAppService's DuplicateWriteException recovery
          # path — see VerificationSessionConfiguration's remarks. The EF
          # Core InMemory provider used by the unit/integration test suite
          # does not enforce filtered indexes at all, so this CI check
          # against a real SQL Server is the only place this index's actual
          # existence and shape are verified.
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'IX_VerificationSessions_AgentEmployeeId_IdempotencyKey';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([IdempotencyKey]ISNOTNULL)" ]; then
            echo "::error::IX_VerificationSessions_AgentEmployeeId_IdempotencyKey filter_definition was '$filter_trimmed', expected '([IdempotencyKey]ISNOTNULL)'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — unique index (TicketNumber, FR-TKT-01)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # TicketCreationAppService.GenerateTicketNumberAsync computes a
          # per-department-per-day sequence from a COUNT query, then relies
          # on this unique index as the real correctness backstop under
          # concurrency (a collision surfaces as DuplicateWriteException via
          # TicketingUnitOfWork, same translation pattern as the two checks
          # above). The EF Core InMemory provider does not enforce unique
          # indexes under concurrent writes (see CustomerVerificationUnitOfWork's
          # remarks) — this is the only place its real existence is verified.
          is_unique=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT is_unique FROM sys.indexes WHERE object_id = OBJECT_ID('Tickets') AND name = 'IX_Tickets_TicketNumber';")
          is_unique_trimmed=$(echo "$is_unique" | tr -d '[:space:]')
          echo "is_unique = '$is_unique_trimmed'"
          if [ "$is_unique_trimmed" != "1" ]; then
            echo "::error::IX_Tickets_TicketNumber is not a unique index (is_unique='$is_unique_trimmed')."
            exit 1
          fi
          echo "Unique index present on Tickets.TicketNumber."

      - name: Verify schema — filtered unique index (one current assignment per ticket)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Backs TicketAssignmentAppService.AssignAsync's history model
          # (MVP-Data-Dictionary.md §2.12: "exactly one true row per
          # TicketId") — the real, SQL-Server-only enforcement the InMemory
          # provider used by the test suite cannot verify.
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'IX_TicketAssignments_TicketId';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([IsCurrent]=(1))" ]; then
            echo "::error::IX_TicketAssignments_TicketId filter_definition was '$filter_trimmed', expected '([IsCurrent]=(1))'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — filtered unique index (one current resolution per ticket)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Backs TicketLifecycleAppService.CloseAsync's "cannot close
          # without a current resolution" gate (MVP-ERD.md §2.14).
          filter=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT filter_definition FROM sys.indexes WHERE name = 'IX_TicketResolutions_TicketId';")
          filter_trimmed=$(echo "$filter" | tr -d '[:space:]')
          echo "filter_definition = '$filter_trimmed'"
          if [ "$filter_trimmed" != "([IsCurrent]=(1))" ]; then
            echo "::error::IX_TicketResolutions_TicketId filter_definition was '$filter_trimmed', expected '([IsCurrent]=(1))'."
            exit 1
          fi
          echo "Filtered unique index present with the expected filter."

      - name: Verify schema — Tickets.RowVersion is a real optimistic-concurrency token
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Backs every assignment/transfer/status-change/resolve/close/
          # reconciliation write's lost-update protection
          # (TicketingUnitOfWork's DbUpdateConcurrencyException translation)
          # — confirms the column is a real SQL Server rowversion, not just
          # an EF Core-side annotation with no database backing.
          data_type=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT DATA_TYPE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME = 'Tickets' AND COLUMN_NAME = 'RowVersion';")
          data_type_trimmed=$(echo "$data_type" | tr -d '[:space:]')
          echo "DATA_TYPE = '$data_type_trimmed'"
          if [ "$data_type_trimmed" != "timestamp" ]; then
            echo "::error::Tickets.RowVersion DATA_TYPE was '$data_type_trimmed', expected 'timestamp' (SQL Server's name for rowversion)."
            exit 1
          fi
          echo "Tickets.RowVersion is a real rowversion/timestamp column."

      - name: Verify schema — Tickets/IntakeRecords column nullability (senior review item 12)
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Confirms directly against real SQL Server, not just EF's
          # in-memory model, the specific nullability decisions this
          # increment's design review confirmed: UnitReferenceId/
          # ContactReferenceId are nullable (the provisional-ticket
          # relaxation), every other Tickets FK/required field is NOT NULL,
          # and IntakeRecords.RawUnitNumberEntered/PriorityHint/LinkedTicketId/
          # DepartmentId are nullable while ChannelId/PhoneNumber/
          # IsUnitRelated/CrmVerificationStatus/CreatedByEmployeeId are not.
          # DepartmentId is optional — it only narrows which customer-lookup
          # source(s) CustomerLookupAppService searches, never a promotion gate.
          #
          # Business-rule change: CRM Buyer Lookup (GET /api/crm/buyers) adds
          # nine nullable Tickets columns — CrmBuyerCustomerId/LeadId/UnitId/
          # ProjectId plus their CustomerName/ProjectName/UnitNumber display
          # snapshots, and the no-match ManualProjectName/ManualUnitNumber
          # pair (Ticket.CreateVerifiedFromCrmBuyer/CreateUnverified) — a
          # distinct identifier space from UnitReferenceId/ContactReferenceId,
          # all optional since a ticket carries at most one of the two paths.
          #
          # External-lookup verification (PACT/Tasleeh — the department-aware
          # customer lookup) adds three more nullable Tickets columns:
          # CustomerVerificationSource plus the source's own ExternalCustomerId/
          # ExternalUnitId (Ticket.CreateFromExternalLookup,
          # AddExternalCustomerVerificationToTickets). External identifiers
          # only — deliberately no FK and no local cache table — and all
          # optional since only an external-lookup ticket carries them.
          #
          # The verified external customer's own name and email add two more
          # nullable Tickets columns: ExternalCustomerName/ExternalCustomerEmail
          # (Ticket.CreateFromExternalLookup,
          # AddExternalCustomerSnapshotToTickets) — the external counterpart of
          # the CrmBuyerCustomerName snapshot above, and nullable for the same
          # reason plus one of its own: PACT's contracts response routinely
          # returns customerEmail null, and a source may hold no name for a
          # customer it has verified. Neither is ever invented to fill the
          # column. There is deliberately no Arabic-name column beside them:
          # PACT has no Arabic (or English/first/last) name field at all, so
          # only CRM can supply one and it is read live, never persisted here.
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT TABLE_NAME + '.' + COLUMN_NAME + '=' + IS_NULLABLE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME IN ('Tickets','IntakeRecords') ORDER BY TABLE_NAME, COLUMN_NAME;" | sed '/^$/d' | tr -d ' ')
          echo "--- actual nullability ---"
          echo "$actual"
          expected=$(printf '%s\n' \
            "IntakeRecords.ChannelId=NO" "IntakeRecords.CreatedByEmployeeId=NO" "IntakeRecords.CrmVerificationStatus=NO" \
            "IntakeRecords.DepartmentId=YES" "IntakeRecords.IntakeRecordId=NO" "IntakeRecords.IsUnitRelated=NO" \
            "IntakeRecords.LinkedTicketId=YES" "IntakeRecords.PhoneNumber=NO" \
            "IntakeRecords.PriorityHint=YES" "IntakeRecords.RawUnitNumberEntered=YES" "IntakeRecords.ReceivedAtUtc=NO" \
            "Tickets.AcknowledgementSentAtUtc=YES" "Tickets.CategoryId=YES" "Tickets.ContactReferenceId=YES" \
            "Tickets.CreatedAtUtc=NO" "Tickets.CurrentDepartmentId=NO" "Tickets.CurrentOwnerEmployeeId=YES" \
            "Tickets.DuplicateOfTicketId=YES" "Tickets.EscalationLevel=NO" "Tickets.FirstHumanResponseAtUtc=YES" \
            "Tickets.OriginatingDepartmentId=NO" "Tickets.PriorityId=YES" "Tickets.ReopenCount=NO" \
            "Tickets.RequestSummary=NO" "Tickets.ResolutionOutcome=YES" "Tickets.SlaState=NO" \
            "Tickets.TicketId=NO" "Tickets.TicketNumber=NO" "Tickets.TicketStatus=NO" \
            "Tickets.UnitReferenceId=YES" "Tickets.VerificationStatus=NO" "Tickets.RowVersion=NO" \
            "Tickets.CreatedByEmployeeId=YES" "Tickets.CrmBuyerCustomerId=YES" "Tickets.CrmBuyerLeadId=YES" "Tickets.CrmBuyerUnitId=YES" \
            "Tickets.CrmBuyerProjectId=YES" "Tickets.CrmBuyerCustomerName=YES" "Tickets.CrmBuyerProjectName=YES" \
            "Tickets.CrmBuyerUnitNumber=YES" "Tickets.ManualProjectName=YES" "Tickets.ManualUnitNumber=YES" \
            "Tickets.CustomerVerificationSource=YES" "Tickets.ExternalCustomerId=YES" "Tickets.ExternalUnitId=YES" \
            "Tickets.ExternalCustomerName=YES" "Tickets.ExternalCustomerEmail=YES" \
            "Tickets.RequestTypeId=YES" "Tickets.WorkflowTemplateId=YES" "Tickets.OriginalHumanAgentId=YES" "Tickets.OriginalAgentWorkflowEnabled=NO" | sort)
          actual_sorted=$(echo "$actual" | sort)
          echo "--- expected nullability ---"
          echo "$expected"
          if [ "$actual_sorted" != "$expected" ]; then
            echo "::error::Tickets/IntakeRecords column nullability does not match the confirmed design exactly."
            diff <(echo "$expected") <(echo "$actual_sorted") || true
            exit 1
          fi
          echo "Column nullability matches the confirmed design exactly (51 columns; Tickets.OriginalAgentWorkflowEnabled, added by AddOriginalAgentWorkflowCutoff, is NOT NULL with a default of 0: the deployment cutoff, false for every ticket that existed before the Original Human Agent feature and set only by ticket creation. Tickets.OriginalHumanAgentId, added by AddTicketOriginalHumanAgent, is nullable by design: write-once, NULL until the first eligible Human Agent owns an AI/integration-created ticket, and no FK; Tickets.CreatedByEmployeeId, added by AddTicketCreatedBy, is nullable by design: write-once, NULL for tickets with no creation audit entry, and deliberately no FK). Tickets.RequestTypeId is nullable by design: tickets predating the Workflow/Automation phases (and callers that do not classify) carry NULL and keep the pre-phase behavior. Tickets.WorkflowTemplateId (the pinned workflow version, AddWorkflowVersioning) is nullable for the same reason: only a ticket with a request type pins a version. Tickets.CategoryId and Tickets.PriorityId both became nullable in AddGenesysIntegration: an inquiry arriving through Genesys is turned into a ticket the moment an agent picks it up, before anyone has read the request, so neither its category nor its urgency has been judged. NULL says so honestly. A placeholder category would drive reporting and routing; a placeholder priority is no more harmless, since priority drives the dashboard KPI counts, the queue order and the attention ranking — the queries handle NULL explicitly (never sorting it ahead of Critical, never counting it as Critical/High). Ticket.Classify sets both later on the same ticket, and that is also when the SLA period is opened. TicketSlaInstances.PriorityId stays NOT NULL: an SLA period only ever exists for a classified ticket. Tickets.ExternalCustomerName/ExternalCustomerEmail are nullable because the verifying source may hold neither — PACT returns customerEmail null routinely — and a snapshot is never invented to fill a column."

      - name: Verify schema — TicketAssignments/TicketResolutions/TicketNotes column nullability
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # Confirms BR-011 (ResolutionNote mandatory) and the assignment/
          # note actor fields directly against real SQL Server.
          actual=$(sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -d TigerCsTicketing_CI -h -1 -W \
            -Q "SET NOCOUNT ON; SELECT TABLE_NAME + '.' + COLUMN_NAME + '=' + IS_NULLABLE FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_NAME IN ('TicketAssignments','TicketResolutions','TicketNotes') ORDER BY TABLE_NAME, COLUMN_NAME;" | sed '/^$/d' | tr -d ' ')
