      - name: Verify schema — foreign keys on the Notifications tables
        run: |
          export PATH="$PATH:/opt/mssql-tools18/bin"
          # MVP-ERD.md §2.21/§2.23 mark every one of these Restrict. A
          # notification and its Outbox message are permanent records of an
          # attempted customer contact, and an idempotency record is the proof
          # a logical event was already handled — a cascade through any of them
