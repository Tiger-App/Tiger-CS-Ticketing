          #
          # The column-name filter below applies across BOTH tables, and the
          # two tables share names: OutboxMessages has its own CorrelationId,
          # and its primary key is literally called OutboxMessageId — the same
          # name as the Notifications foreign key pointing at it. Both are
          # listed explicitly rather than filtered out, so this check asserts
          # every row the query can return instead of quietly ignoring the two
